name: Persona
version: '${version}'

main: nu.miguel.persona.Main
api-version: '26.2'
load: POSTWORLD
depend: [Citizens]
provides: [PersonaAPI]
commands:
  persona:
    description: Persona dialogue and quest commands
    usage: /persona <quests|quest|dialogue|npc|memory|behavior|editor|example|validate|debug|diagnostics|support|backup|reload>
permissions:
  persona.player.quests:
    default: true
  persona.player.dialogue.cancel:
    default: true
  persona.admin.npc:
    default: op
  persona.admin.quest:
    default: op
  persona.admin.reload:
    default: op
  persona.admin.memory:
    default: op
    children:
      persona.admin.memory.inspect.global: true
      persona.admin.memory.inspect.player: true
      persona.admin.memory.modify.global: true
      persona.admin.memory.modify.player: true
      persona.admin.memory.migrate: true
  persona.admin.memory.inspect.global:
    default: op
  persona.admin.memory.inspect.player:
    default: op
  persona.admin.memory.modify.global:
    default: op
  persona.admin.memory.modify.player:
    default: op
  persona.admin.memory.migrate:
    default: op
  persona.admin.backup:
    default: op
  persona.admin.behavior:
    default: op
  persona.admin.validate:
    default: op
  persona.admin.debug:
    default: op
  persona.admin.support:
    default: op
  persona.admin.editor.open:
    description: Open a short-lived hosted Persona editor session
    default: op
  persona.admin.editor.view:
    description: View Persona content in a hosted editor session
    default: op
  persona.admin.editor.drafts:
    description: Edit and autosave isolated hosted Persona drafts
    default: op
  persona.admin.editor.players:
    description: View scoped online-player and live NPC state in the hosted editor
    default: op
  persona.admin.editor.memories:
    description: View permitted memory namespaces in the hosted editor
    default: op
  persona.admin.editor.publish:
    description: Request content validation and publication from the hosted editor
    default: op
  persona.admin.editor.mutate:
    description: Request typed live mutations from the hosted editor
    default: op
