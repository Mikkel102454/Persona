dialogue:
  default-line-delay: 2s
  inactivity-timeout: 120s
  maximum-distance: 8.0
messages:
  quest-started: "<green>Quest started: <white><quest>"
  quest-progress: "<yellow><objective>: <current>/<required>"
  phase-complete: "<green>Phase complete: <phase>"
  quest-complete: "<gold>Quest complete: <quest>"
  content-loading: "<yellow>Your Persona data is still loading. Try again shortly."
editor:
  # Emergency kill switch. Read-only monitoring remains available when false.
  live-mutations-enabled: false
  # Memory values stay redacted unless their key is in one of these namespaces.
  memory-visible-namespaces: []
  enabled: false
  # Publication additionally requires persona.admin.editor.publish, explicit session
  # trust, a short-lived browser-generated confirmation code, and /persona editor apply.
  publish-enabled: false
  # The centrally hosted Spring Boot service. Production deployments must use HTTPS.
  hosted-url: https://editor.persona.invalid
  # Intended only for local development against localhost.
  allow-insecure-transport: false
  # Revoke sessions opened by a player when that player disconnects.
  close-on-player-quit: true
memory:
  expiry:
    # Expired rows may be retained briefly for forensic database inspection. Reads
    # still treat them as expired immediately.
    retention: 0s
    sweep-interval: 60s
  # Optional ownership declarations. Extensions automatically own their identifier.
  # A claimed prefix protects keys such as "example:trust" from other extensions.
  namespaces: {}
behavior:
  diagnostics:
    slow-milliseconds: 5.0
  tick-cadence: 1
  senses:
    proximity-range: 16
  scheduler:
    node-evaluations: 5000
    milliseconds: 4
  navigation:
    arrival-distance: 1.5
    speed: 1.0
    pathfinding-range: 64
    stuck-seconds: 10
    stuck-action: fail
    stuck-retries: 1
  projections:
    per-player: 25
    server: 500
    activation-range: 48
    suspend-seconds: 30
    # Repeated limit/filter/spawn diagnostics are collapsed to one log entry per key.
    diagnostics-seconds: 30
    transitions:
      # Set either effect to "none" to disable it. Effects are sent only to the owner.
      spawn-particle: minecraft:poof
      despawn-particle: minecraft:poof
      spawn-sound: none
      despawn-sound: none
      # Spread the effect over this period for a softer materialize/dematerialize.
      duration-ticks: 8
      particle-count: 12
      volume: 0.7
      pitch: 1.0
    debug:
      # Shows the selected anchor at ground level and the logical/navigation position
      # one block higher, and only to the player who owns the presentation.
      enabled: false
      particle: minecraft:dust_plume
      interval-ticks: 10
